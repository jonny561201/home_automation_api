[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-automation-api"
version = "1.0.0"
description = "A centralized home automation project API server.  Interfaces with other microservices to provide a unified home automation experience."
authors = [
    { name = "Jon Graf", email = "jgraf@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
urls = { "repository" = "https://github.com/jonny561201/home_automation_api" }
requires-python = ">=3.9"
dependencies = [
    "dataclasses-json==0.6.7",
    "flask==3.0.2",
    "flask_cors==6.0.0",
    "psycopg2==2.9.7",
    "PyJWT==2.10.1",
    "SQLAlchemy==1.3.22",
    "requests==2.32.4",
    "RPi.GPIO==0.7.0",
    "uwsgi==2.0.19.1",
    "yoyo-migrations==7.2.1",
]

[project.optional-dependencies]
test = [
    "pytest==6.2.1",
    "mock==3.0.5",
]

[tool.setuptools.packages.find]
where = ["svc"]
include = ["svc*"]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration"]
addopts = "--strict-markers"

[tool.pyright]
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
